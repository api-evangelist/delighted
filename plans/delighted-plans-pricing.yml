name: Delighted Plans and Pricing
description: >-
  Pricing plans for the Delighted customer satisfaction and NPS survey platform.
  Plans are structured around monthly survey responses and user seats, with all
  plans including unlimited survey creation, branding customization, and access
  to multiple survey types (NPS, CSAT, CES, eNPS, PMF, 5-star, Smileys, Thumbs).
specificationVersion: '0.1'
plans:
  - name: Free
    description: >-
      Entry-level free plan for individuals exploring Delighted's NPS and
      customer satisfaction survey capabilities. Includes 25 survey responses
      per month and 1 user seat with access to core survey types and reporting.
    url: https://delighted.com/pricing
    price: 0.00
    currency: USD
    billingCycle: monthly
    unit: month
    features:
      - name: Survey Responses
        description: Up to 25 survey responses per month
        quota: 25
        unit: responses/month
      - name: Users
        description: 1 user seat
        quota: 1
        unit: users
      - name: Survey Types
        description: NPS, CSAT, CES, 5-star, Smileys, Thumbs, eNPS, PMF
      - name: Unlimited Survey Creation
        description: Create unlimited surveys across CX project types
      - name: Survey Branding
        description: Customize survey branding and question text
      - name: Question Logic
        description: Conditional logic and dynamic personalization
      - name: Community Access
        description: Access to Delighted Community for support

  - name: Starter
    description: >-
      Starter plan for small teams beginning to systematically collect customer
      feedback. Includes 50 monthly responses, 2 users, and integrations with
      popular business tools.
    url: https://delighted.com/pricing
    price: 19.00
    currency: USD
    billingCycle: monthly
    unit: month
    features:
      - name: Survey Responses
        description: Up to 50 survey responses per month
        quota: 50
        unit: responses/month
      - name: Users
        description: 2 user seats
        quota: 2
        unit: users
      - name: Survey Types
        description: NPS, CSAT, CES, 5-star, Smileys, Thumbs, eNPS, PMF
      - name: Unlimited Survey Creation
        description: Create unlimited surveys across CX project types
      - name: Integrations
        description: 35+ free integrations including Slack, Shopify, Zendesk
        quota: 35
        unit: integrations
      - name: Delivery Channels
        description: Email, web embed, SDK, kiosk, and link delivery options
      - name: Reports
        description: 7 pre-built reports with AI-driven trend analysis
        quota: 7
        unit: reports
      - name: Personalization
        description: Dynamic personalization and conditional question logic

  - name: Growth
    description: >-
      Growth plan for growing teams that need more responses and additional user
      seats to manage customer feedback programs. Includes all Starter features
      plus higher response and user limits.
    url: https://delighted.com/pricing
    price: 39.00
    currency: USD
    billingCycle: monthly
    unit: month
    features:
      - name: Survey Responses
        description: Up to 100 survey responses per month
        quota: 100
        unit: responses/month
      - name: Users
        description: 3 user seats
        quota: 3
        unit: users
      - name: Survey Types
        description: NPS, CSAT, CES, 5-star, Smileys, Thumbs, eNPS, PMF
      - name: Unlimited Survey Creation
        description: Create unlimited surveys across CX project types
      - name: Integrations
        description: 35+ free integrations including Slack, Shopify, Zendesk
        quota: 35
        unit: integrations
      - name: Delivery Channels
        description: Email, web embed, SDK, kiosk, and link delivery options
      - name: Reports
        description: 7 pre-built reports with AI-driven trend analysis
        quota: 7
        unit: reports
      - name: Personalization
        description: Dynamic personalization and conditional question logic

  - name: Advanced
    description: >-
      Advanced plan for established customer experience programs that need
      higher response volumes and larger teams. Includes all Growth features
