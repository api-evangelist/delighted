aid: delighted
name: Delighted
description: >-
  Delighted is an NPS and customer satisfaction survey platform with a REST API
  for managing surveys, collecting responses, segmenting results, and accessing
  trend data for CSAT, NPS, and CES. The API supports sending surveys to people,
  listing and adding survey responses, managing Autopilot configurations,
  retrieving metrics, handling webhooks, and managing unsubscribes and people
  records. Authentication is via HTTP Basic Auth using per-project API keys.
type: Index
