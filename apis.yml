    name: Delighted API
    description: >-
      REST API for the Delighted customer satisfaction platform. Enables sending
      surveys, retrieving and adding survey responses, accessing NPS and CSAT
      metrics, managing Autopilot drip campaigns, handling webhooks for
      real-time events, and managing people records including unsubscribes and
      bounces.
